[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnpyreader"
version = "0.1.0"
description = "将 Python 源码翻译为中文代码，帮助中文用户阅读代码。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "<你的名字>" }]
keywords = ["python", "chinese", "code-reader", "tokenize"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
]

[project.scripts]
cnpyreader = "cnpyreader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]